[pytest]

testpaths = tests
python_files = test_*.py

addopts = 
    -v 
    -s
    --html=reports/report.html

markers =
    smoke: quick critical tests to check basic functionality
    sanity: focused tests to validate specific features
    regression: full suite to catch regressions in existing functionality

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S